name: DiagnoRx archived development branch cleanup
on:
  pull_request:
    types: [synchronize]

# Temporary feature-branch-only self-cleanup. main remains unchanged.
permissions:
  contents: write
  actions: read

jobs:
  delete-archived-feature-branch:
    if: ${{ github.event.pull_request.head.ref == 'feature/clinical-safety-quality-20261024' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check complete ZIP backup exists and delete only this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GH_REPO" = "Caliptra79/DiagnoRx"
          BACKUP_EXPIRED="$(gh api "repos/$GH_REPO/actions/artifacts/12542632784" --jq .expired)"
          test "$BACKUP_EXPIRED" = "false"
          BACKUP_NAME="$(gh api "repos/$GH_REPO/actions/artifacts/12542632784" --jq .name)"
          test "$BACKUP_NAME" = "diagnorx-restorable-complete-branch"
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/feature/clinical-safety-quality-20261024"
          echo "Archived feature branch deleted. main untouched."
