name: DiagnoRx static checks

# One check per PR update; avoid duplicate push + pull_request runs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate app syntax and record invariants
        run: node tests/static-check.cjs
      - name: Validate clinical safety rules
        run: node tests/clinical-safety-check.cjs
      - name: Validate namespaced note privacy controls
        run: node tests/privacy-check.cjs
      - name: Check evidence and independent review for future diagnoses
        run: node tests/new-diagnosis-gate.cjs
      - name: Validate evidence-linked research remains unapproved
        run: node tests/clinical-research-check.cjs
      - name: Check bulk clinical audit engine
        run: node tests/bulk-clinical-audit-check.cjs
      - name: Test common source document review list
        run: node tests/review-worklist-check.cjs
      - name: Produce reusable document and regimen queues
        run: node scripts/review-worklist.cjs --write
      - name: Generate downloadable clinical triage reports
        run: node scripts/bulk-clinical-audit.cjs --write
      - name: Upload clinical triage reports
        uses: actions/upload-artifact@v7
        with:
          name: diagnorx-clinical-triage
          path: |
            audit/generated/bulk-clinical-audit.json
            audit/generated/bulk-clinical-audit.md
            audit/generated/review-worklist.md
            audit/generated/review-worklist.json
            audit/generated/medicine-document-queue.csv
            audit/generated/regimen-review.csv
            audit/generated/diagnosis-review-queue.csv
          retention-days: 30
      - name: Inventory clinical data without changing prescriptions
        run: node tests/clinical-inventory.cjs
